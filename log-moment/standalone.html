<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Log Moment — Scout Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --grass-11: #2a7e3b;
      --border: #e5e5e5;
      --muted-bg: #f5f5f5;
      --muted: #737373;
      --text: #0a0a0a;
      --gray-12: #202020;
      --destructive: #dc2626;
    }
    html, body {
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #ececec;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
      background: #ececec;
    }
    .phone {
      width: 100%;
      max-width: 402px;
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 32px 0;
      height: 44px;
      flex-shrink: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .status-icons svg { display: block; }

    /* Header */
    .header {
      padding: 4px 32px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-meta { font-size: 12px; color: var(--muted); line-height: 16px; }
    .header-title { font-size: 18px; font-weight: 600; line-height: 28px; margin-top: 4px; }
    .tabs {
      display: flex;
      background: var(--muted-bg);
      border-radius: 10px;
      padding: 3px;
      margin-top: 16px;
      height: 36px;
    }
    .tab {
      flex: 1;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
    }
    .tab.active {
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 1px 1.5px rgba(0,0,0,.1);
    }

    /* Content */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .log-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 0;
      padding: 24px 32px 28px;
      gap: 18px;
    }
    .context-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      flex-shrink: 0;
      width: 100%;
    }
    .back-link {
      display: block;
      align-self: flex-start;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      cursor: pointer;
      line-height: 20px;
    }
    .match-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: 100%;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      padding: 2px 10px;
      background: var(--destructive);
      color: rgba(255,255,255,.95);
      font-size: 12px;
      font-weight: 500;
      border-radius: 10px;
      width: fit-content;
    }
    .match-title { font-size: 18px; font-weight: 600; line-height: 28px; color: var(--gray-12); }

    .add-player {
      display: inline-flex;
      align-items: stretch;
      align-self: flex-start;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,.1);
      background: #fff;
      flex-shrink: 0;
      height: 36px;
    }
    .add-player span {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-right: 1px solid var(--border);
    }
    .add-player button {
      width: 36px;
      border: none;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .add-player svg { width: 16px; height: 16px; stroke: var(--text); fill: none; stroke-width: 2; }

    /* FIFA cards carousel */
    .cards-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      flex-shrink: 0;
      height: 224px;
      width: 100%;
      padding-left: 4px;
      padding-right: 32px;
      margin-right: -32px;
    }
    .cards-scroll::-webkit-scrollbar { display: none; }

    .fut-card {
      flex: 0 0 156px;
      width: 156px;
      height: 224px;
      position: relative;
      scroll-snap-align: start;
      cursor: pointer;
    }
    .fut-card .shield-stroke {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .fut-card .shield {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .fut-card .shield img, .fut-card .shield svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .fut-card .avatar {
      position: absolute;
      left: 50%;
      top: 61px;
      transform: translateX(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      overflow: hidden;
      background: #ddd;
    }
    .fut-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .fut-card .rating {
      position: absolute;
      left: 18px;
      top: 25px;
      font-size: 22px;
      font-weight: 700;
      color: #292933;
      line-height: 1;
    }
    .fut-card .pos {
      position: absolute;
      left: 20px;
      top: 52px;
      font-size: 8px;
      font-weight: 600;
      color: #292933;
    }
    .fut-card .club {
      position: absolute;
      left: 20px;
      top: 67px;
      width: 16px;
      height: 16px;
    }
    .fut-card .club img { width: 100%; height: 100%; }
    .fut-card .club-label {
      position: absolute;
      left: 20px;
      top: 71px;
      width: 16px;
      text-align: center;
      font-size: 5px;
      font-weight: 700;
      color: #6b6b7a;
    }
    .fut-card .ball-top {
      position: absolute;
      right: 18px;
      top: 27px;
      font-size: 11px;
    }
    .fut-card .name {
      position: absolute;
      left: 50%;
      top: 123px;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 700;
      color: #292933;
      white-space: nowrap;
    }
    .fut-card .divider {
      position: absolute;
      left: 29px;
      top: 143px;
      width: 99px;
      height: 1px;
      background: #ccccd6;
    }
    .fut-card .stats {
      position: absolute;
      left: 29px;
      right: 29px;
      top: 150px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 8px;
      font-size: 8px;
    }
    .fut-card .stat-val { font-weight: 700; color: #292933; }
    .fut-card .stat-lbl { font-weight: 400; color: #6b6b7a; margin-left: 2px; }
    .fut-card .ball-bottom {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      font-size: 8px;
    }

    /* Log moments panel */
    .log-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 20px 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      width: 100%;
    }
    .log-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .log-panel-head h2 { font-size: 14px; font-weight: 600; color: var(--gray-12); line-height: 20px; }
    .time-badge {
      font-size: 12px;
      font-weight: 400;
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      height: 22px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      line-height: 16px;
    }
    .tags {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag {
      flex-shrink: 0;
      padding: 8px 16px;
      background: var(--muted-bg);
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-12);
      cursor: pointer;
      font-family: inherit;
      line-height: 20px;
      transition: background .15s, border-color .15s;
    }
    .tag.active {
      background: #e8f5ea;
      border-color: var(--grass-11);
      color: var(--grass-11);
    }
    .note-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      gap: 8px;
      min-height: 48px;
    }
    .note-field input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 12px;
      line-height: 16px;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      min-width: 0;
    }
    .note-field input::placeholder { color: var(--muted); }
    .note-field button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
    }
    .note-field svg { width: 24px; height: 24px; stroke: var(--text); fill: none; stroke-width: 1.75; }
    .btn-log {
      width: 100%;
      padding: 14px 16px;
      background: var(--grass-11);
      color: #fafafa;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
      letter-spacing: 0.01em;
    }
    .btn-log:hover { background: #236832; }
    .btn-log:active { transform: scale(.98); }

    /* Saved moments view */
    .saved-view { display: none; flex-direction: column; gap: 12px; flex: 1; padding: 24px 32px 28px; overflow-y: auto; }
    .saved-view.visible { display: flex; }
    .log-view.hidden { display: none; }
    .saved-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      background: #fff;
    }
    .saved-item .player { font-size: 14px; font-weight: 600; }
    .saved-item .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .saved-item .tags-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .saved-item .tag-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      background: var(--muted-bg);
      border-radius: 999px;
    }
    .empty-saved {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 48px 16px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--gray-12);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: transform .25s, opacity .25s;
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx=".5"/><rect x="5" y="2" width="3" height="10" rx=".5"/><rect x="10" y="1" width="3" height="11" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.4C5.6 2.4 3.4 3.4 1.8 5L0 3.2C2.1 1.2 4.9 0 8 0s5.9 1.2 8 3.2L14.2 5C12.6 3.4 10.4 2.4 8 2.4zm0 3.6c-1.5 0-2.9.6-3.9 1.6L2.3 5.5C3.8 4 5.8 3.2 8 3.2s4.2.8 5.7 2.3l-1.8 1.7C10.9 6.6 9.5 6 8 6zm0 3.6c-.8 0-1.5.3-2.1.9L8 12l2.1-1.5c-.6-.6-1.3-.9-2.1-.9z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3" stroke="currentColor"/><rect x="2" y="2" width="17" height="9" rx="1.5" fill="currentColor"/><path d="M24 4.5h2a1 1 0 0 1 0 2h-2v-2z" fill="currentColor"/></svg>
        </div>
      </div>

      <header class="header">
        <p class="header-meta">ECNL Charlotte · Saturday</p>
        <h1 class="header-title">Scout Companion</h1>
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" id="tab-log" role="tab" aria-selected="true">Log data</button>
          <button type="button" class="tab" id="tab-saved" role="tab" aria-selected="false">Saved moments</button>
        </div>
      </header>

      <div class="content">
        <!-- Log data view -->
        <div class="log-view" id="log-view">
          <div class="context-section">
            <button type="button" class="back-link">← Fields</button>
            <div class="match-block">
              <span class="live-badge">Live</span>
              <p class="match-title">Field 7 · GA Aspire vs FC Dallas</p>
            </div>
          </div>

          <div class="add-player">
            <span>+ Add player</span>
            <button type="button" aria-label="Expand"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
          </div>

          <div class="cards-scroll" id="cards-scroll"></div>

          <div class="log-panel">
            <div class="log-panel-head">
              <h2 id="log-title">Log moments</h2>
              <span class="time-badge" id="time-badge">10:15AM</span>
            </div>
            <div class="tags" id="tags">
              <button type="button" class="tag" data-tag="Shot">Shot</button>
              <button type="button" class="tag" data-tag="Duel">Duel</button>
              <button type="button" class="tag" data-tag="Compete">Compete</button>
              <button type="button" class="tag" data-tag="Flag">Flag</button>
            </div>
            <div class="note-field">
              <input type="text" id="note-input" placeholder="Add a quick note" aria-label="Quick note" />
              <button type="button" aria-label="Voice note">
                <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-3.08A7 7 0 0 0 19 11z"/></svg>
              </button>
            </div>
            <button type="button" class="btn-log" id="btn-log">★  Log moment</button>
          </div>
        </div>

        <!-- Saved moments view -->
        <div class="saved-view" id="saved-view">
          <p class="match-title" style="font-size:16px">Saved moments</p>
          <div id="saved-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const STROKE_OVERLAY = 'assets/shield-gray-stroke.svg';

    const PLAYERS = [
      {
        id: 'jordan',
        name: 'Jordan Lee',
        rating: 84,
        pos: 'CM',
        club: 'CE',
        avatar: 'assets/avatar-jordan.png',
        shield: ['assets/shield-gray-fill.svg'],
        stats: [['6', 'WCH'], ['1×', 'LIVE'], ['HI', 'INT'], ['12', 'ROW']],
      },
      {
        id: 'sam',
        name: 'Sam Ortiz',
        rating: 86,
        pos: 'CM',
        club: 'GA',
        avatar: 'assets/avatar-sam.png',
        shield: ['assets/shield-gold.svg'],
        stats: [['4', 'WCH'], ['0×', 'LIVE'], ['HI', 'INT'], ['18', 'ROW']],
      },
      {
        id: 'lena',
        name: 'Lena Kim',
        rating: 79,
        pos: 'FW',
        club: 'BR',
        avatar: 'assets/avatar-lena.png',
        shield: ['assets/shield-green.svg'],
        stats: [['9', 'CLB'], ['2×', 'LIVE'], ['LO', 'FRI'], ['7', 'ROW']],
      },
      {
        id: 'mateo',
        name: 'Mateo Rossi',
        rating: 91,
        pos: 'DF',
        club: 'IT',
        avatar: 'assets/avatar-mateo.png',
        shield: ['assets/shield-pink.svg'],
        stats: [['3', 'WCH'], ['1×', 'LIVE'], ['HI', 'INT'], ['21', 'ROW']],
      },
    ];

    let selectedPlayer = PLAYERS[0];
    let savedMoments = [];
    const activeTags = new Set();

    function isSelected(player) {
      return player.id === selectedPlayer.id;
    }

    function renderCards() {
      const root = document.getElementById('cards-scroll');
      root.innerHTML = PLAYERS.map(p => {
        const shieldHtml = p.shield.map(s => `<img src="${s}" alt="" />`).join('');
        const strokeHtml = isSelected(p)
          ? `<img class="shield-stroke" src="${STROKE_OVERLAY}" alt="" />`
          : '';
        const statsHtml = p.stats.map(([v, l]) =>
          `<div><span class="stat-val">${v}</span><span class="stat-lbl">${l}</span></div>`
        ).join('');
        return `<article class="fut-card" data-id="${p.id}" aria-label="${p.name}" aria-current="${isSelected(p)}">
          <div class="shield">${shieldHtml}${strokeHtml}</div>
          <span class="rating">${p.rating}</span>
          <span class="pos">${p.pos}</span>
          <div class="club"><img src="assets/club-badge.svg" alt="" /></div>
          <span class="club-label">${p.club}</span>
          <span class="ball-top">⚽</span>
          <div class="avatar"><img src="${p.avatar}" alt="${p.name}" /></div>
          <span class="name">${p.name}</span>
          <div class="divider"></div>
          <div class="stats">${statsHtml}</div>
          <span class="ball-bottom">⚽</span>
        </article>`;
      }).join('');

      root.querySelectorAll('.fut-card').forEach(card => {
        card.addEventListener('click', () => {
          selectedPlayer = PLAYERS.find(p => p.id === card.dataset.id);
          renderCards();
          updateLogTitle();
        });
      });
    }

    function updateLogTitle() {
      document.getElementById('log-title').textContent = 'Log moments';
    }

    function updateTime() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      document.getElementById('time-badge').textContent = `${h}:${m}${ampm}`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function renderSaved() {
      const list = document.getElementById('saved-list');
      if (!savedMoments.length) {
        list.innerHTML = '<p class="empty-saved">No moments logged yet.<br>Switch to Log data to capture one.</p>';
        return;
      }
      list.innerHTML = savedMoments.slice().reverse().map(m => `
        <div class="saved-item">
          <div class="player">${m.player}</div>
          <div class="meta">${m.time}${m.note ? ' · ' + m.note : ''}</div>
          ${m.tags.length ? `<div class="tags-row">${m.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>` : ''}
        </div>
      `).join('');
    }

    document.getElementById('tags').addEventListener('click', (e) => {
      const btn = e.target.closest('.tag');
      if (!btn) return;
      const tag = btn.dataset.tag;
      if (activeTags.has(tag)) {
        activeTags.delete(tag);
        btn.classList.remove('active');
      } else {
        activeTags.add(tag);
        btn.classList.add('active');
      }
    });

    document.getElementById('btn-log').addEventListener('click', () => {
      const note = document.getElementById('note-input').value.trim();
      const moment = {
        player: selectedPlayer.name,
        time: document.getElementById('time-badge').textContent,
        tags: [...activeTags],
        note,
      };
      savedMoments.push(moment);
      showToast(`Logged moment for ${selectedPlayer.name}`);
      document.getElementById('note-input').value = '';
      activeTags.clear();
      document.querySelectorAll('.tag.active').forEach(t => t.classList.remove('active'));
      renderSaved();
    });

    document.getElementById('tab-log').addEventListener('click', () => {
      document.getElementById('tab-log').classList.add('active');
      document.getElementById('tab-saved').classList.remove('active');
      document.getElementById('log-view').classList.remove('hidden');
      document.getElementById('saved-view').classList.remove('visible');
    });

    document.getElementById('tab-saved').addEventListener('click', () => {
      document.getElementById('tab-saved').classList.add('active');
      document.getElementById('tab-log').classList.remove('active');
      document.getElementById('log-view').classList.add('hidden');
      document.getElementById('saved-view').classList.add('visible');
      renderSaved();
    });

    renderCards();
    updateLogTitle();
    updateTime();
    renderSaved();
  </script>
</body>
</html>
