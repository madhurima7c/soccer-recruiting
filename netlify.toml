[build]
  command = "npm run build"
  publish = "dist"

# Shareable default — Kit Flow 1 desktop prototype (force overrides index.html)
[[redirects]]
  from = "/"
  to = "/desktop-flow1/index.html"
  status = 200
  force = true

# Kit Flow 1 — shareable desktop prototype
